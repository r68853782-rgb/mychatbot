<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Groq AI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 420px;
      height: 650px;
      max-width: 95%;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      font-weight: normal;
      margin-top: 5px;
      opacity: 0.85;
    }

    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #f8fafc;
    }

    .message-wrapper {
      display: flex;
      margin-bottom: 12px;
    }

    .message-wrapper.user-wrapper {
      justify-content: flex-end;
    }

    .message-wrapper.bot-wrapper {
      justify-content: flex-start;
    }

    .message {
      max-width: 80%;
      padding: 11px 14px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background: #e5e7eb;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    .typing {
      color: #6b7280;
      font-style: italic;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: white;
    }

    #userInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    #userInput:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 500px) {
      body {
        align-items: stretch;
      }

      .chat-container {
        width: 100%;
        max-width: 100%;
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="chat-header">
      🤖 Groq AI Chatbot
      <div class="status">Powered by Groq</div>
    </div>

    <div class="chat-box" id="chatBox">

      <div class="message-wrapper bot-wrapper">
        <div class="message bot">
          Hello! 👋 Main Groq AI chatbot hoon. Aap mujhse kuch bhi pooch sakte hain.
        </div>
      </div>

    </div>

    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Type your message..."
        autocomplete="off"
      >

      <button id="sendButton" onclick="sendMessage()">
        Send
      </button>

    </div>

  </div>


  <script>

    /*
      =====================================================
      GROQ API KEY
      =====================================================

      Yahan apni NEW Groq API key paste karo.

      Example:

      const GROQ_API_KEY = "gsk_xxxxxxxxxxxxxxxxx";

      IMPORTANT:
      Browser/frontend mein API key rakhna production ke liye
      secure nahi hai.

      Production website ke liye backend/server use karo.
    */

    const GROQ_API_KEY = "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";


    /*
      Groq Chat Completions API
    */

    const GROQ_API_URL =
      "https://api.groq.com/openai/v1/chat/completions";


    /*
      Current conversation history
    */

    let conversation = [
      {
        role: "system",
        content:
          "You are a helpful, friendly and intelligent AI assistant. " +
          "Answer clearly and concisely. " +
          "You can understand Hindi, Hinglish and English. " +
          "If the user speaks Hindi or Hinglish, respond naturally in Hindi/Hinglish."
      }
    ];


    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");
    const sendButton = document.getElementById("sendButton");


    /*
      Add message to UI
    */

    function addMessage(text, type, extraClass = "") {

      const wrapper = document.createElement("div");

      wrapper.classList.add(
        "message-wrapper",
        type === "user" ? "user-wrapper" : "bot-wrapper"
      );

      const messageDiv = document.createElement("div");

      messageDiv.classList.add(
        "message",
        type,
        extraClass
      );

      messageDiv.textContent = text;

      wrapper.appendChild(messageDiv);
      chatBox.appendChild(wrapper);

      scrollToBottom();

      return messageDiv;
    }


    /*
      Scroll chat to bottom
    */

    function scrollToBottom() {
      chatBox.scrollTop = chatBox.scrollHeight;
    }


    /*
      Send message
    */

    async function sendMessage() {

      const message = input.value.trim();

      if (!message) {
        return;
      }


      /*
        API key check
      */

      if (
        !GROQ_API_KEY ||
        GROQ_API_KEY === "PASTE_YOUR_NEW_GROQ_API_KEY_HERE"
      ) {

        addMessage(
          "⚠️ Please apni Groq API key code mein add karein.",
          "bot",
          "error"
        );

        return;
      }


      /*
        Show user message
      */

      addMessage(message, "user");

      input.value = "";

      input.disabled = true;
      sendButton.disabled = true;
      sendButton.textContent = "...";


      /*
        Add user message to conversation
      */

      conversation.push({
        role: "user",
        content: message
      });


      /*
        Typing indicator
      */

      const typingMessage = addMessage(
        "🤖 Thinking...",
        "bot",
        "typing"
      );


      try {

        const response = await fetch(GROQ_API_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + GROQ_API_KEY
          },

          body: JSON.stringify({

            /*
              Groq model
            */

            model: "llama-3.3-70b-versatile",

            /*
              Conversation history
            */

            messages: conversation,

            /*
              Maximum generated tokens
            */

            max_completion_tokens: 1024,

            /*
              Creativity
            */

            temperature: 0.7,

            /*
              Normal non-streaming response
            */

            stream: false

          })

        });


        /*
          Convert response to JSON
        */

        const data = await response.json();


        /*
          Handle API errors
        */

        if (!response.ok) {

          console.error("Groq API Error:", data);

          throw new Error(
            data?.error?.message ||
            "Groq API request failed."
          );
        }


        /*
          Get AI response
        */

        const botResponse =
          data?.choices?.[0]?.message?.content;


        if (!botResponse) {

          throw new Error(
            "AI ne koi response return nahi kiya."
          );
        }


        /*
          Remove typing indicator
        */

        typingMessage.parentElement.remove();


        /*
          Show AI response
        */

        addMessage(botResponse, "bot");


        /*
          Save AI response to conversation
        */

        conversation.push({
          role: "assistant",
          content: botResponse
        });


      } catch (error) {

        console.error(error);

        /*
          Remove typing indicator
        */

        if (
          typingMessage &&
          typingMessage.parentElement
        ) {
          typingMessage.parentElement.remove();
        }


        /*
          Show error
        */

        addMessage(
          "❌ Error: " + error.message,
          "bot",
          "error"
        );

      } finally {

        input.disabled = false;
        sendButton.disabled = false;
        sendButton.textContent = "Send";

        input.focus();

      }

    }


    /*
      Enter key support
    */

    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();

        }

      }
    );


  </script>

</body>
</html>
